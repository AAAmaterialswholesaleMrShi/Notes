<rect x="10" y="70" width="130" height="36" rx="6" fill="#1f4d3a"/><text x="75" y="93" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#f7f4ee">用户</text><line x1="75" y1="106" x2="75" y2="470" stroke="#1d2a24" stroke-dasharray="4 4"/><rect x="170" y="70" width="130" height="36" rx="6" fill="#1f4d3a"/><text x="235" y="93" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#f7f4ee">列表界面</text><line x1="235" y1="106" x2="235" y2="470" stroke="#1d2a24" stroke-dasharray="4 4"/><rect x="360" y="70" width="130" height="36" rx="6" fill="#1f4d3a"/><text x="425" y="93" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#f7f4ee">TrashPolicy</text><line x1="425" y1="106" x2="425" y2="470" stroke="#1d2a24" stroke-dasharray="4 4"/><rect x="560" y="70" width="130" height="36" rx="6" fill="#1f4d3a"/><text x="625" y="93" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#f7f4ee">DataUtils</text><line x1="625" y1="106" x2="625" y2="470" stroke="#1d2a24" stroke-dasharray="4 4"/><rect x="750" y="70" width="130" height="36" rx="6" fill="#1f4d3a"/><text x="815" y="93" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#f7f4ee">note 表</text><line x1="815" y1="106" x2="815" y2="470" stroke="#1d2a24" stroke-dasharray="4 4"/><line x1="75" y1="150" x2="230" y2="150" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="152.5" y="144.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">删除</text><line x1="235" y1="200" x2="420" y2="200" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="327.5" y="194.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">decide</text><line x1="425" y1="250" x2="235" y2="250" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="330.0" y="244.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">MOVE_TO_TRASH</text><line x1="235" y1="310" x2="620" y2="310" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="427.5" y="304.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">moveNotesToTrash</text><line x1="625" y1="360" x2="810" y2="360" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="717.5" y="354.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">parent_id=-3, origin_parent_id=当前父id</text><line x1="75" y1="430" x2="230" y2="430" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="152.5" y="424.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">在回收站选择恢复</text><text x="32" y="530" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#6d5b3d">恢复时 DataUtils 再读 origin_parent_id，调用 restoreParent。原文件夹不存在则回到根目录 0。已经在回收站里的删除才是物理删除。</text>
