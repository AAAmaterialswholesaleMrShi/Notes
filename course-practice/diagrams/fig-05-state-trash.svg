<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="100%" height="100%" fill="#f7f4ee"/>
  <text x="32" y="36" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="20" fill="#1d2a24">图5  便签删除状态图</text>
  
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#8a5a2a"/>
  </marker>
</defs>
<ellipse cx="180" cy="180" rx="90" ry="40" fill="#fffdf8" stroke="#1f4d3a" stroke-width="1.6"/><text text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="14" fill="#1d2a24"><tspan x="180" y="180">在普通文件夹</tspan></text><ellipse cx="480" cy="180" rx="90" ry="40" fill="#e7f0ea" stroke="#1f4d3a" stroke-width="1.6"/><text text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="14" fill="#1d2a24"><tspan x="480" y="180">在回收站</tspan></text><ellipse cx="780" cy="180" rx="90" ry="40" fill="#fffdf8" stroke="#1f4d3a" stroke-width="1.6"/><text text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="14" fill="#1d2a24"><tspan x="780" y="180">记录已删除</tspan></text><line x1="270" y1="180" x2="390" y2="180" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="330.0" y="174.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">删除</text><line x1="390" y1="220" x2="270" y2="220" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="330.0" y="214.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">恢复</text><line x1="570" y1="180" x2="690" y2="180" stroke="#8a5a2a" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630.0" y="174.0" text-anchor="middle" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="12" fill="#8a5a2a">永久删除或清空</text><text x="32" y="320" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif" font-size="13" fill="#6d5b3d">状态由图中的 note.parent_id 表达：不是 -3 表示还在普通位置，等于 -3 表示在回收站。物理删除后行不再存在。没有新增状态表。</text>
</svg>
